<title>Plattform-Architektur (post-CF-MIG, Stand 2026-05-25)</title>
<desc>Übersicht der Plattform-Container von außen (Internet via Cloudflare Tunnel) bis innen (PG-Hub, AI-Pipeline, Egress-Schutz). Drei Wege rein: cloudflared für HTTPS, Tailscale für Admin-SSH. Foundation-Stack visuell abgesetzt.</desc>
